<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products · CRATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>requireAuth();</script>
</head>
<body>
<div class="app-shell">
 
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-text">CRATE</div>
        <div class="brand-sub">Inventory System</div>
      </div>
    </div>
 
    <nav class="nav">
      <div class="nav-label">Catalog</div>
      <a href="products.html" class="active">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
        Products
      </a>
      <a href="suppliers.html">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 7l2-4h14l2 4"></path><path d="M3 7h18v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"></path><path d="M9 12h6"></path></svg>
        Suppliers
      </a>
    </nav>
 
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="userInitial">A</div>
        <div>
          <div class="user-name" id="userEmail">Admin User</div>
          <div class="user-role">ADMINISTRATOR</div>
        </div>
      </div>
      <a href="#" class="logout-link" id="logoutBtn">Sign out →</a>
    </div>
  </aside>
 
  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-eyebrow">Catalog</div>
        <h1 class="page-title">Products</h1>
        <p class="page-desc" id="productSummary">Loading…</p>
      </div>
      <div class="topbar-actions">
        <a href="product-form.html" class="btn btn-amber">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add product
        </a>
      </div>
    </div>
 
    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="search-field">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search products by name…">
      </div>
      <select id="supplierFilter">
        <option value="">All suppliers</option>
      </select>
      <select id="stockFilter">
        <option value="">All stock levels</option>
        <option value="low">Low stock only</option>
        <option value="ok">In stock</option>
      </select>
    </div>
 
    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Supplier</th>
            <th>Price</th>
            <th>Stock</th>
            <th></th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
          <!-- Rows are rendered by js/products.js -->
        </tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <h3>No products match</h3>
        <p>Try a different search term or clear the filters.</p>
      </div>
    </div>
 
  </main>
</div>
<script src="js/products.js"></script>
</body>
</html>
